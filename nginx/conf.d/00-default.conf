# Docker's embedded DNS. Together with `set $upstream` in each app file, nginx
# resolves app containers at request time: it starts even if an app is down
# and picks up the new IP when a container is recreated by a deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket support (ActionCable).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Unknown hosts (scanners, direct IP access): close the connection.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}
