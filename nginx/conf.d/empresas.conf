# ssc-empresas-privadas (Thruster/Puma on :80 inside its container)

server {
  listen 80;
  server_name empresas.sscqroo.gob.mx empresas.localhost;

  # Excel uploads up to 50MB.
  client_max_body_size 50m;

  set $upstream http://empresas-app:80;

  location /up {
    include snippets/proxy.conf;
    proxy_pass $upstream;
  }

  # Maintenance branding, served from this container's disk so it still loads
  # while the app is down. Matched before "/" so it never hits the 503 below.
  location ^~ /maintenance-assets/ {
    alias /etc/nginx/brand/;
    access_log off;
  }

  location / {
    # The app's deploy workflow creates this file before swapping containers
    # and removes it once the new one is healthy. Checked per request.
    if (-f /etc/nginx/maintenance/empresas/on) {
      return 503;
    }

    include snippets/proxy.conf;
    proxy_pass $upstream;
  }

  error_page 503 @maintenance;

  location @maintenance {
    root /etc/nginx/maintenance/empresas;
    rewrite ^ /maintenance.html break;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
  }
}
