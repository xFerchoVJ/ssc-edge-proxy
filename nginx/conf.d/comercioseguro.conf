# comercio-seguro-ssc-cancun (Puma on :3000 inside its container)

server {
  listen 80;
  server_name comercioseguro.sscqroo.gob.mx comercioseguro.localhost;

  # Evidence photos and Excel imports.
  client_max_body_size 50m;

  set $upstream http://comercioseguro-web:3000;

  location /up {
    include snippets/proxy.conf;
    proxy_pass $upstream;
  }

  location ^~ /maintenance-assets/ {
    alias /etc/nginx/brand/;
    access_log off;
  }

  location / {
    if (-f /etc/nginx/maintenance/comercioseguro/on) {
      return 503;
    }

    include snippets/proxy.conf;
    proxy_pass $upstream;
  }

  error_page 503 @maintenance;

  location @maintenance {
    root /etc/nginx/maintenance/comercioseguro;
    rewrite ^ /maintenance.html break;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
  }
}
